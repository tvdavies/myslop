name: Deploy

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to deploy
        required: true
        type: choice
        default: platform
        options:
          - platform
          - apps
          - all
      app:
        description: App reconciliation target
        required: true
        type: choice
        default: all
        options:
          - all
          - files
          - mail
      apply_domains:
        description: Reconcile public domain aliases (cutover operation)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: myslop-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Deploy platform
        if: inputs.scope != 'apps'
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
      - name: Wait for platform health
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error https://apps.myslop.app/schema/v1.json && exit 0
            sleep 10
          done
          exit 1
      - name: Reconcile apps
        if: inputs.scope != 'platform'
        env:
          MYSLOP_APPS_TOKEN: ${{ secrets.MYSLOP_APPS_TOKEN }}
          MYSLOP_APPLY_DOMAINS: ${{ inputs.apply_domains }}
          SELECTED_APP: ${{ inputs.app }}
        run: |
          if [ "$SELECTED_APP" != "all" ]; then
            export MYSLOP_APP_FILTER="$SELECTED_APP"
          fi
          bun run sync-apps
