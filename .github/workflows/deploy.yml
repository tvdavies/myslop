name: Deploy

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to deploy
        required: true
        type: choice
        default: platform
        options:
          - platform
          - apps
          - all
      app:
        description: App reconciliation target
        required: true
        type: choice
        default: all
        options:
          - all
          - files
          - mail
      apply_domains:
        description: Reconcile public domain aliases (cutover operation)
        required: true
        type: boolean
        default: false
      adopt_resources:
        description: Adopt manifest-declared production D1/R2 resources
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "apps/**"
      - "scripts/sync-apps.ts"
      - "scripts/sync-apps.test.ts"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: myslop-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  changes:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.detect.outputs.platform }}
      apps: ${{ steps.detect.outputs.apps }}
      base: ${{ steps.detect.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Select deployment scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          platform=false
          apps=false
          base="$(git rev-parse HEAD^)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$MANUAL_SCOPE" in
              platform) platform=true ;;
              apps) apps=true ;;
              all) platform=true; apps=true ;;
            esac
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "Cannot prove the previous main revision; refusing automatic deployment" >&2
              exit 1
            fi
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
            while IFS= read -r path; do
              case "$path" in
                platform/*) platform=true ;;
              esac
              case "$path" in
                apps/*|scripts/sync-apps.ts|scripts/sync-apps.test.ts) apps=true ;;
                platform/src/artifact.ts|platform/src/manifest.ts|platform/src/core.ts|platform/src/cron.ts) apps=true ;;
                package.json|bun.lock) platform=true; apps=true ;;
              esac
            done <<< "$changed"
          fi

          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Selected platform=$platform apps=$apps"

  deploy:
    needs: [verify, changes]
    if: >-
      needs.verify.result == 'success' &&
      (needs.changes.outputs.platform == 'true' || needs.changes.outputs.apps == 'true') &&
      (github.event_name == 'workflow_dispatch' || vars.MYSLOP_CD_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Deploy platform
        if: needs.changes.outputs.platform == 'true'
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
      - name: Wait for platform health
        if: needs.changes.outputs.platform == 'true'
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error https://apps.myslop.app/schema/v1.json >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Verify production surfaces after platform deploy
        if: needs.changes.outputs.platform == 'true'
        run: |
          check() {
            url="$1"
            for attempt in $(seq 1 30); do
              curl --fail --silent --show-error "$url" >/dev/null && return 0
              sleep 10
            done
            return 1
          }
          check https://files.myslop.app/skill.md
          check https://mail.myslop.app/skill.md
      - name: Reconcile apps
        if: needs.changes.outputs.apps == 'true'
        env:
          MYSLOP_APPS_TOKEN: ${{ secrets.MYSLOP_APPS_TOKEN }}
          MYSLOP_TEAM: ${{ vars.MYSLOP_TEAM }}
          MYSLOP_APPLY_DOMAINS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_domains || 'false' }}
          MYSLOP_ADOPT_RESOURCES: ${{ github.event_name == 'workflow_dispatch' && inputs.adopt_resources || 'false' }}
          MYSLOP_DEPLOY_BASE: ${{ needs.changes.outputs.base }}
          SELECTED_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.app || 'all' }}
        run: |
          if [ -z "$MYSLOP_TEAM" ]; then
            echo "MYSLOP_TEAM production variable is required" >&2
            exit 1
          fi
          if [ "$SELECTED_APP" != "all" ]; then
            export MYSLOP_APP_FILTER="$SELECTED_APP"
          fi
          bun run sync-apps
      - name: Verify first-party app health
        if: needs.changes.outputs.apps == 'true'
        env:
          APPLY_DOMAINS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_domains || 'false' }}
          SELECTED_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.app || 'all' }}
        run: |
          check() {
            url="$1"
            for attempt in $(seq 1 30); do
              curl --fail --silent --show-error "$url" >/dev/null && return 0
              sleep 10
            done
            return 1
          }
          for app in files mail; do
            if [ "$SELECTED_APP" != "all" ] && [ "$SELECTED_APP" != "$app" ]; then
              continue
            fi
            if [ ! -d "apps/$app" ]; then
              continue
            fi
            check "https://$app.apps.myslop.app/skill.md"
            if [ "$APPLY_DOMAINS" = "true" ]; then
              check "https://$app.myslop.app/skill.md"
            fi
          done
      - name: Record release
        env:
          PLATFORM_CHANGED: ${{ needs.changes.outputs.platform }}
          APPS_CHANGED: ${{ needs.changes.outputs.apps }}
        run: |
          {
            echo "## Production release"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Platform: \`$PLATFORM_CHANGED\`"
            echo "- Apps: \`$APPS_CHANGED\`"
          } >> "$GITHUB_STEP_SUMMARY"
