<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>plans.myslop.app</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23374151'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' font-family='sans-serif' fill='%23fff'%3Ep%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f8f9fa;
    --panel: #ffffff;
    --border: #e2e5e9;
    --text: #1f2328;
    --dim: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-bg: #eff4fe;
    --accent-border: #bfd3f8;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --ok: #15803d;
    --ok-bg: #f0fdf4;
    --ok-border: #bbe3c8;
    --warn: #b45309;
    --warn-bg: #fef8ec;
    --warn-border: #f5d9a8;
    --code-bg: #f3f4f6;
    --hover: #f3f4f6;
    --agent-fg: #6d28d9;
    --agent-bg: #f3effe;
    --agent-border: #ddd3f8;
    --del-bg: #fecaca;
    --del-fg: #7f1d1d;
    --ins-bg: #bbf7d0;
    --ins-fg: #14532d;
    --toast-bg: #1f2328;
    --toast-fg: #ffffff;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1116;
    --panel: #161b23;
    --border: #2a3140;
    --text: #dde2e9;
    --dim: #8e97a6;
    --accent: #4d8bf5;
    --accent-hover: #6b9ef7;
    --accent-bg: #1a2740;
    --accent-border: #31538c;
    --danger: #f07171;
    --danger-bg: #2c1719;
    --ok: #4cc38a;
    --ok-bg: #132a1d;
    --ok-border: #265c3d;
    --warn: #e0a83e;
    --warn-bg: #2b2110;
    --warn-border: #5e4a1e;
    --code-bg: #1d232e;
    --hover: #212938;
    --agent-fg: #b7a4f7;
    --agent-bg: #251d3d;
    --agent-border: #41346a;
    --del-bg: #54222a;
    --del-fg: #f5b3bd;
    --ins-bg: #1b3b28;
    --ins-fg: #9fe0b8;
    --toast-bg: #e7eaee;
    --toast-fg: #14171c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 16px; line-height: 1.6; min-height: 100vh;
  }
  code, pre, .mono { font-family: inherit; }
  .shell { display: grid; grid-template-columns: 1fr minmax(0, 780px) 1fr; }
  .wrap { grid-column: 2; min-width: 0; padding: 0 32px 140px; }
  header.top {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0 12px; margin-bottom: 32px; font-size: 14px;
  }
  .logo { font-weight: 600; }
  .logo a { color: var(--text); text-decoration: none; }
  .logo .muted { color: var(--dim); font-weight: 400; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .userbox { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; }
  .userbox img { width: 26px; height: 26px; border-radius: 50%; }
  button {
    font: inherit; font-size: 13.5px; cursor: pointer; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); border-radius: 6px; padding: 6px 12px;
  }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); }
  button.approve { color: var(--ok); border-color: var(--ok-border); }
  button.approve:hover { background: var(--ok-bg); }
  button.reqchanges { color: var(--warn); border-color: var(--warn-border); }
  button.reqchanges:hover { background: var(--warn-bg); }
  button.small { padding: 2px 9px; font-size: 12.5px; }
  button.linkish { border: none; background: none; color: var(--dim); padding: 2px 6px; font-size: 12.5px; }
  button.linkish:hover { color: var(--accent); background: none; }
  button.ghost {
    border: none; background: none; color: var(--dim); padding: 6px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 5px; line-height: 1;
  }
  button.ghost:hover { background: var(--hover); color: var(--text); }
  button.ghost svg { width: 18px; height: 18px; }
  #tray-toggle-n { font-size: 12.5px; font-weight: 600; }
  #tray-toggle-n:empty { display: none; }
  select {
    font: inherit; font-size: 13.5px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 5px 8px;
  }
  textarea {
    font: inherit; font-size: 14px; width: 100%; min-height: 70px; resize: vertical;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    color: var(--text);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hero { max-width: 460px; margin: 90px auto; text-align: center; }
  .hero h1 { font-size: 22px; margin-bottom: 10px; font-weight: 600; }
  .hero p { color: var(--dim); margin-bottom: 26px; }

  .plan-head { padding-bottom: 4px; margin-bottom: 26px; }
  .plan-head h1 { font-size: 28px; font-weight: 700; line-height: 1.3; margin-bottom: 10px; }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--dim); font-size: 13px; }
  .status {
    font-size: 12px; padding: 2px 10px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--panel); white-space: nowrap;
  }
  .status.approved { color: var(--ok); border-color: var(--ok-border); background: var(--ok-bg); }
  .status.changes_requested { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .controls .spacer { flex: 1; }
  .review-strip { margin-top: 8px; color: var(--dim); font-size: 13px; }
  .review-strip .v-approved { color: var(--ok); }
  .review-strip .v-changes { color: var(--warn); }
  .banner {
    margin: 14px 0 0; padding: 9px 14px; border: 1px solid var(--warn-border); background: var(--warn-bg);
    border-radius: 7px; font-size: 13.5px; color: var(--warn);
  }
  .banner button { margin-left: 8px; }

  /* --- document --- */
  article { padding: 10px 34px 0 0; line-height: 1.7; }
  article h1, article h2, article h3, article h4, article h5, article h6 { line-height: 1.35; margin: 40px 0 12px; }
  article h1, article h2 { margin-top: 56px; margin-bottom: 16px; }
  article h1 { font-size: 23px; } article h2 { font-size: 20px; } article h3 { font-size: 17.5px; }
  article h4, article h5, article h6 { font-size: 16px; }
  article p { margin: 17px 0; }
  article ul, article ol { margin: 17px 0; padding-left: 24px; }
  article li { margin: 7px 0; }
  article li > ul, article li > ol { margin: 4px 0; }
  article pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 14px 16px; margin: 20px 0; overflow-x: auto; font-size: 14px; line-height: 1.5;
  }
  article code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; font-size: 0.9em; }
  article pre code { background: none; padding: 0; font-size: inherit; }
  article blockquote { border-left: 3px solid var(--border); color: var(--dim); padding: 2px 14px; margin: 17px 0; }
  article table { border-collapse: collapse; margin: 20px 0; font-size: 14px; }
  article th, article td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
  article th { background: var(--code-bg); }
  article img { max-width: 100%; border: 1px solid var(--border); border-radius: 7px; }
  article hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  [data-block-id] { position: relative; }
  .addbtn {
    position: absolute; right: -32px; top: 1px; width: 24px; height: 24px;
    display: none; align-items: center; justify-content: center;
    font-size: 15px; color: var(--dim); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer; padding: 0;
    line-height: 1; z-index: 2;
  }
  /* Invisible bridge over the gap between the block and the button, so the
     block keeps :hover while the pointer travels to the button. */
  .addbtn::before { content: ""; position: absolute; top: -6px; bottom: -6px; right: 100%; width: 12px; }
  [data-block-id]:hover > .addbtn { display: inline-flex; }
  .addbtn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
  /* Comment-count badge on blocks that have threads; the hover + moves below it. */
  .cbadge {
    position: absolute; right: -32px; top: 1px; min-width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 600; color: var(--accent); background: var(--accent-bg);
    border: 1px solid var(--accent-border); border-radius: 6px; cursor: pointer; padding: 0 5px;
    line-height: 1; z-index: 2;
  }
  .cbadge.resolved { color: var(--dim); background: var(--code-bg); border-color: var(--border); }
  [data-block-id]:has(> .cbadge) > .addbtn { top: 29px; }
  @keyframes flashfade { from { background: var(--accent-bg); } to { background: transparent; } }
  .flash { animation: flashfade 1.6s ease-out; }

  /* --- contents rail --- */
  #toc {
    grid-column: 1; justify-self: end; align-self: start;
    position: sticky; top: 76px; width: 232px; margin: 96px 40px 0 24px;
    max-height: calc(100vh - 100px); overflow-y: auto;
    font-size: 12.5px; line-height: 1.5; padding-bottom: 24px;
  }
  .toc-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--dim); margin-bottom: 8px; padding-left: 8px;
  }
  #toc a { display: block; color: var(--dim); text-decoration: none; padding: 4px 8px; border-radius: 5px; overflow-wrap: break-word; }
  #toc a:hover { color: var(--text); background: var(--hover); }
  #toc a.active { color: var(--accent); }
  #toc a.lvl2 { padding-left: 20px; }
  #toc a.lvl3 { padding-left: 32px; }
  #doc [data-block-id] { scroll-margin-top: 72px; }
  body.diffing #toc { display: none; }
  @media (max-width: 1340px) { #toc { display: none; } }
  @media (max-width: 1760px) { body.tray-open #toc { display: none; } }

  /* --- comments --- */
  .threads { margin: 6px 0 10px; }
  li .threads { margin: 6px 0 2px; }
  .thread {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 7px; padding: 10px 14px; margin: 8px 0; font-size: 13.5px;
  }
  .thread.resolved { border-left-color: var(--border); opacity: 0.62; }
  .c { margin-bottom: 8px; }
  .c:last-of-type { margin-bottom: 4px; }
  .c.reply { margin-left: 18px; padding-left: 12px; border-left: 2px solid var(--border); }
  .c-head { display: flex; align-items: center; gap: 8px; margin-bottom: 1px; }
  .c-author { font-weight: 600; font-size: 13px; }
  .c-author img { width: 18px; height: 18px; border-radius: 50%; vertical-align: -4px; margin-right: 4px; }
  .agent-badge {
    font-size: 11px; font-weight: 600; color: var(--agent-fg); background: var(--agent-bg);
    border: 1px solid var(--agent-border); border-radius: 99px; padding: 0 8px;
  }
  .c-date { color: var(--dim); font-size: 12px; }
  .c-ver { color: var(--warn); font-size: 12px; }
  .c-body { white-space: pre-wrap; overflow-wrap: break-word; }
  .t-actions { display: flex; gap: 4px; margin-top: 4px; }
  .composer { margin: 8px 0; }
  .composer .c-actions { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }
  .blockref {
    display: block; width: 100%; text-align: left; font-size: 12px; color: var(--dim);
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px;
    padding: 3px 8px; margin-bottom: 6px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .blockref:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }

  /* --- comments side tray --- */
  #tray {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 94vw;
    background: var(--panel); border-left: 1px solid var(--border);
    padding: 16px 18px 24px; overflow-y: auto; z-index: 6;
  }
  #tray .thread { background: var(--bg); }
  .tray-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .tray-head h2 {
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--dim);
  }
  .tray-empty { color: var(--dim); font-size: 13.5px; margin: 8px 0 14px; }
  body.tray-open { padding-right: 400px; }
  @media (max-width: 1280px) { body.tray-open { padding-right: 0; } }

  /* --- diff view --- */
  #diffdoc { padding: 10px 34px 0 0; }
  .dpart { border-left: 3px solid transparent; padding: 0 10px; margin: 2px 0; border-radius: 4px; }
  .dpart.added { border-left-color: var(--ok); background: var(--ok-bg); }
  .dpart.removed { border-left-color: var(--danger); background: var(--danger-bg); opacity: 0.75; }
  .dpart.changed { border-left-color: var(--warn); background: var(--warn-bg); }
  .dpart .wdiff { white-space: pre-wrap; font-size: 14px; padding: 8px 2px; overflow-wrap: break-word; }
  .wdiff del { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; border-radius: 3px; padding: 0 2px; }
  .wdiff ins { background: var(--ins-bg); color: var(--ins-fg); text-decoration: none; border-radius: 3px; padding: 0 2px; }
  ul.dli { margin: 6px 0; padding-left: 24px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--toast-bg); color: var(--toast-fg); border-radius: 8px;
    padding: 9px 18px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10; font-size: 13px;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); color: #fff; }
  @media (max-width: 720px) {
    .wrap { padding: 20px 20px 100px; }
    article, #diffdoc { padding-right: 26px; }
    .addbtn, .cbadge { right: -26px; }
  }
</style>
<script>
  // Theme boot: runs before first paint. Preference cycles auto → light → dark;
  // "auto" follows the system.
  (() => {
    const KEY = "plans-theme";
    const root = document.documentElement;
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const stored = () => {
      const v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    };
    // Icons: Lucide (lucide.dev, ISC license) — monitor / sun / moon.
    const ICONS = {
      auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>',
      light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
      dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
    };
    const apply = () => {
      const pref = stored();
      root.dataset.theme = pref ?? (mq.matches ? "dark" : "light");
      const btn = document.getElementById("theme-btn");
      if (btn) {
        const label = pref ?? "auto";
        btn.innerHTML = ICONS[label];
        btn.title = "Theme: " + label + " — click to change";
        btn.setAttribute("aria-label", "Theme: " + label);
      }
    };
    mq.addEventListener("change", apply);
    window.__cycleTheme = () => {
      const pref = stored();
      const next = pref === null ? "light" : pref === "light" ? "dark" : null;
      if (next) localStorage.setItem(KEY, next);
      else localStorage.removeItem(KEY);
      apply();
    };
    apply();
    document.addEventListener("DOMContentLoaded", apply);
  })();
</script>
</head>
<body>
<div class="shell">
<nav id="toc" hidden aria-label="Contents"></nav>
<div class="wrap">
  <header class="top">
    <div class="logo"><a href="/dashboard">plans<span class="muted">.myslop.app</span></a></div>
    <div class="top-actions">
      <button id="tray-toggle" class="ghost" hidden aria-expanded="false" title="Comments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span id="tray-toggle-n"></span>
      </button>
      <button id="theme-btn" class="ghost" onclick="__cycleTheme()"></button>
      <div class="userbox" id="userbox" hidden>
        <img id="user-pic" alt="" hidden>
        <span id="user-name"></span>
      </div>
    </div>
  </header>

  <div id="view-loading" class="hero"><p>Loading…</p></div>

  <div id="view-signin" class="hero" hidden>
    <h1>Review this plan</h1>
    <p>Sign in to read the plan, leave comments, and approve or request changes.</p>
    <button class="primary" id="signin-btn">Sign in with shoo.dev</button>
  </div>

  <div id="view-missing" class="hero" hidden>
    <h1>Plan not found</h1>
    <p>This plan doesn't exist or was deleted by its owner.</p>
  </div>

  <div id="view-plan" hidden>
    <div class="plan-head">
      <h1 id="plan-title"></h1>
      <div class="meta">
        <span class="status" id="plan-status"></span>
        <span id="plan-owner"></span>
        <span id="plan-updated"></span>
      </div>
      <div class="controls">
        <select id="version-select" title="View a version"></select>
        <button id="compare-btn">Compare…</button>
        <span id="compare-controls" hidden>
          <select id="diff-from"></select>
          →
          <select id="diff-to"></select>
          <button class="small" id="compare-close">Close</button>
        </span>
        <span class="spacer"></span>
        <button class="approve" id="approve-btn">Approve</button>
        <button class="reqchanges" id="changes-btn">Request changes</button>
      </div>
      <div class="review-strip" id="review-strip"></div>
    </div>

    <div class="banner" id="old-banner" hidden></div>

    <article id="doc"></article>
    <div id="diffdoc" hidden></div>

    <aside id="tray" hidden>
      <div class="tray-head">
        <h2>Comments <span id="tray-count"></span></h2>
        <button class="ghost" id="tray-close" title="Close" aria-label="Close comments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div id="tray-threads"></div>
      <div class="composer">
        <textarea id="general-input" placeholder="Leave a comment on this plan…"></textarea>
        <div class="c-actions"><button class="primary" id="general-send">Comment</button></div>
      </div>
    </aside>
  </div>
</div>
</div>
<div id="toast"></div>

<script>
(() => {
  const SHOO = "https://shoo.dev";
  const ORIGIN = location.origin;
  const PLAN_ID = location.pathname.split("/")[2];
  const REDIRECT_URI = ORIGIN + location.pathname;
  const POLL_MS = 7000;
  const $ = (id) => document.getElementById(id);

  let state = null; // last /api/plans/:id payload
  let me = null;

  // --- helpers ---
  const toastEl = $("toast");
  let toastTimer;
  function toast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.className = "show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (toastEl.className = ""), 3000);
  }
  function show(view) {
    for (const v of ["view-loading", "view-signin", "view-missing", "view-plan"]) $(v).hidden = v !== view;
    $("userbox").hidden = view !== "view-plan";
    $("tray-toggle").hidden = view !== "view-plan";
    if (view !== "view-plan") { $("toc").hidden = true; setTray(false, false); }
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtDate(ts) {
    if (!ts) return "—";
    const d = new Date(ts);
    return d.toISOString().slice(0, 10) + " " + d.toTimeString().slice(0, 5);
  }
  function excerpt(text, n = 90) {
    const t = String(text).replace(/\s+/g, " ").trim();
    return t.length > n ? t.slice(0, n - 1) + "…" : t;
  }
  function flash(el) {
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  }
  async function api(path, opts = {}) {
    const res = await fetch(path, {
      headers: opts.body ? { "content-type": "application/json" } : {},
      ...opts,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (res.status === 401) { const e = new Error("unauthorized"); e.unauthorized = true; throw e; }
    if (res.status === 404) { const e = new Error("not found"); e.missing = true; throw e; }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return res.json();
  }

  // --- comments tray ---
  function trayOpen() {
    return document.body.classList.contains("tray-open");
  }
  function setTray(open, persist = true) {
    document.body.classList.toggle("tray-open", open);
    $("tray").hidden = !open;
    $("tray-toggle").setAttribute("aria-expanded", String(open));
    if (persist) localStorage.setItem("plans-tray", open ? "open" : "closed");
  }
  $("tray-toggle").addEventListener("click", () => setTray(!trayOpen()));
  $("tray-close").addEventListener("click", () => setTray(false));

  // --- contents rail ---
  $("toc").addEventListener("click", (e) => {
    const a = e.target.closest("a[data-target]");
    if (!a) return;
    e.preventDefault();
    const el = document.querySelector(`#doc [data-block-id="${CSS.escape(a.dataset.target)}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  let tocTick = false;
  function updateTocActive() {
    const links = [...$("toc").querySelectorAll("a[data-target]")];
    if (!links.length) return;
    let active = null;
    for (const a of links) {
      const el = document.querySelector(`#doc [data-block-id="${CSS.escape(a.dataset.target)}"]`);
      if (el && el.getBoundingClientRect().top <= 130) active = a;
    }
    for (const a of links) a.classList.toggle("active", a === (active ?? links[0]));
  }
  addEventListener("scroll", () => {
    if (tocTick) return;
    tocTick = true;
    requestAnimationFrame(() => { tocTick = false; updateTocActive(); });
  }, { passive: true });

  // --- shoo PKCE (redirects back to this plan URL) ---
  function randStr(len) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
    const rand = crypto.getRandomValues(new Uint8Array(len));
    let out = "";
    for (const b of rand) out += chars[b % chars.length];
    return out;
  }
  function b64url(bytes) {
    let bin = "";
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
  }
  async function signIn() {
    const verifier = randStr(64);
    const stateStr = randStr(32);
    sessionStorage.setItem("shoo_pkce", JSON.stringify({ verifier, state: stateStr, t: Date.now() }));
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
    const u = new URL("/authorize", SHOO);
    u.searchParams.set("client_id", "origin:" + ORIGIN);
    u.searchParams.set("redirect_uri", REDIRECT_URI);
    u.searchParams.set("state", stateStr);
    u.searchParams.set("code_challenge", b64url(new Uint8Array(digest)));
    u.searchParams.set("code_challenge_method", "S256");
    u.searchParams.set("pii", "true");
    location.assign(u);
  }
  async function handleCallback() {
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const stateStr = params.get("state");
    if (!code || !stateStr) return false;
    params.delete("code");
    params.delete("state");
    const qs = params.toString();
    history.replaceState({}, "", location.pathname + (qs ? "?" + qs : ""));
    let pkce = null;
    try { pkce = JSON.parse(sessionStorage.getItem("shoo_pkce")); } catch {}
    sessionStorage.removeItem("shoo_pkce");
    if (!pkce || pkce.state !== stateStr || Date.now() - pkce.t > 10 * 60 * 1000) {
      toast("Sign-in expired, try again", true);
      return false;
    }
    const res = await fetch(new URL("/token", SHOO), {
      method: "POST",
      headers: { "content-type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: "origin:" + ORIGIN,
        redirect_uri: REDIRECT_URI,
        code,
        code_verifier: pkce.verifier,
      }),
    });
    if (!res.ok) { toast("Token exchange failed", true); return false; }
    const tok = await res.json();
    const sess = await fetch("/api/session", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ id_token: tok.id_token }),
    });
    if (!sess.ok) { toast("Session creation failed", true); return false; }
    return true;
  }

  // --- rendering ---
  const STATUS_LABEL = { open: "Open", approved: "Approved", changes_requested: "Changes requested" };

  function viewedVersion() {
    return Number(new URLSearchParams(location.search).get("v")) || 0;
  }

  function commentHtml(c) {
    const author = c.author.type === "agent"
      ? `<span class="c-author">${esc(c.author.name.replace(/^Agent · /, ""))}</span><span class="agent-badge">agent</span>`
      : `<span class="c-author">${c.author.picture ? `<img src="${esc(c.author.picture)}" alt="">` : ""}${esc(c.author.name)}</span>`;
    return `<div class="c${c.parent_id ? " reply" : ""}" data-cid="${esc(c.id)}">
      <div class="c-head">${author}<span class="c-date">${fmtDate(c.created_at)}</span></div>
      <div class="c-body">${esc(c.body)}</div>
    </div>`;
  }

  function threadHtml(root, replies, blockRef) {
    const onOld = root.version !== state.plan.version
      ? `<span class="c-ver">on v${root.version}${root.block_id && !root.display_block_id ? " (block removed)" : ""}</span>` : "";
    const del = root.mine || state.plan.is_owner
      ? `<button class="linkish" data-act="delete" data-cid="${esc(root.id)}">Delete</button>` : "";
    const ref = blockRef && root.display_block_id
      ? `<button class="blockref" data-act="goto-block" data-block="${esc(root.display_block_id)}" title="Jump to this block">§ ${esc(blockRef)}</button>`
      : "";
    return `<div class="thread${root.resolved ? " resolved" : ""}" data-cid="${esc(root.id)}">
      ${ref}
      ${onOld ? `<div class="c-head" style="margin-bottom:4px">${onOld}</div>` : ""}
      ${commentHtml(root)}
      ${replies.map(commentHtml).join("")}
      <div class="t-actions">
        <button class="linkish" data-act="reply" data-cid="${esc(root.id)}">Reply</button>
        <button class="linkish" data-act="resolve" data-cid="${esc(root.id)}" data-resolved="${root.resolved ? 1 : 0}">${root.resolved ? "Unresolve" : "Resolve"}</button>
        ${del}
      </div>
      <div class="composer" data-reply-composer hidden>
        <textarea placeholder="Reply…"></textarea>
        <div class="c-actions"><button class="small" data-act="reply-cancel">Cancel</button><button class="primary small" data-act="reply-send" data-cid="${esc(root.id)}">Reply</button></div>
      </div>
    </div>`;
  }

  function composerHtml(blockId) {
    return `<div class="composer" data-block-composer="${esc(blockId)}">
      <textarea placeholder="Comment on this block…"></textarea>
      <div class="c-actions"><button class="small" data-act="block-cancel">Cancel</button><button class="primary small" data-act="block-send" data-block="${esc(blockId)}">Comment</button></div>
    </div>`;
  }

  function threadsContainerFor(el) {
    let container = el.tagName === "LI" ? el.querySelector(":scope > .threads") : (el.nextElementSibling?.classList?.contains("threads") ? el.nextElementSibling : null);
    if (!container) {
      container = document.createElement("div");
      container.className = "threads";
      if (el.tagName === "LI") el.appendChild(container);
      else el.insertAdjacentElement("afterend", container);
    }
    return container;
  }

  function renderPlanView() {
    const p = state.plan;
    document.title = p.title + " · plans.myslop.app";
    $("plan-title").textContent = p.title;
    const st = $("plan-status");
    st.textContent = STATUS_LABEL[p.status] || p.status;
    st.className = "status " + p.status;
    $("plan-owner").textContent = "by " + p.owner;
    $("plan-updated").textContent = "updated " + fmtDate(p.updated_at);

    // Version picker
    const sel = $("version-select");
    sel.innerHTML = state.versions.map((v) =>
      `<option value="${v.version}" ${v.version === p.version ? "selected" : ""} title="${esc(v.note || "")}">v${v.version} · ${fmtDate(v.created_at).slice(0, 10)}${v.version === p.current_version ? " (current)" : ""}</option>`,
    ).join("");

    // Review strip: verdicts on the current version
    const current = state.reviews.filter((r) => r.version === p.current_version);
    $("review-strip").innerHTML = current.length
      ? "Reviews on v" + p.current_version + ": " + current.map((r) =>
          `<span class="${r.verdict === "approved" ? "v-approved" : "v-changes"}">${esc(r.by)} ${r.verdict === "approved" ? "✓ approved" : "✗ requested changes"}${r.note ? ` — “${esc(r.note)}”` : ""}</span>`,
        ).join(" · ")
      : "No reviews yet on v" + p.current_version + ".";

    // Old-version banner + review buttons only for the current version
    const old = p.version !== p.current_version;
    $("old-banner").hidden = !old;
    if (old) {
      $("old-banner").innerHTML = `Viewing v${p.version} — the current version is v${p.current_version}. <button class="small" id="goto-current">View current</button>`;
      $("goto-current").addEventListener("click", () => { location.search = ""; });
    }
    $("approve-btn").disabled = old;
    $("changes-btn").disabled = old;
    const mine = state.my_review;
    $("approve-btn").textContent = mine?.verdict === "approved" ? "Approved ✓" : "Approve";
    $("changes-btn").textContent = mine?.verdict === "changes_requested" ? "Changes requested ✗" : "Request changes";

    // Document
    const doc = $("doc");
    doc.innerHTML = state.html;

    // Contents rail: built from headings before the gutter buttons are
    // appended, so the link text is clean.
    const headings = [...doc.querySelectorAll("h1[data-block-id], h2[data-block-id], h3[data-block-id]")];
    const toc = $("toc");
    if (headings.length >= 2) {
      const minLvl = Math.min(...headings.map((h) => Number(h.tagName[1])));
      toc.innerHTML = `<div class="toc-title">Contents</div>` + headings.map((h) =>
        `<a href="#" class="lvl${Number(h.tagName[1]) - minLvl + 1}" data-target="${esc(h.dataset.blockId)}">${esc(h.textContent)}</a>`,
      ).join("");
      toc.hidden = false;
    } else {
      toc.innerHTML = "";
      toc.hidden = true;
    }

    const blockOrder = new Map();
    let orderIdx = 0;
    for (const el of doc.querySelectorAll("[data-block-id]")) {
      blockOrder.set(el.dataset.blockId, orderIdx++);
      if (el.tagName === "HR") continue;
      const btn = document.createElement("button");
      btn.className = "addbtn";
      btn.title = "Comment on this block";
      btn.textContent = "+";
      btn.dataset.addComment = el.dataset.blockId;
      el.appendChild(btn);
    }

    // Comments: threads live in the side tray, ordered by document position
    // (block-anchored first, then general/orphaned by date).
    const roots = state.comments.filter((c) => !c.parent_id);
    const replies = (id) => state.comments.filter((c) => c.parent_id === id);
    const blocksById = new Map(state.blocks.map((b) => [b.id, b.text]));
    const sorted = [...roots].sort((a, b) => {
      const ao = a.display_block_id && blockOrder.has(a.display_block_id) ? blockOrder.get(a.display_block_id) : Infinity;
      const bo = b.display_block_id && blockOrder.has(b.display_block_id) ? blockOrder.get(b.display_block_id) : Infinity;
      return ao - bo || a.created_at - b.created_at;
    });
    $("tray-threads").innerHTML = sorted.length
      ? sorted.map((root) => {
          const text = root.display_block_id ? blocksById.get(root.display_block_id) : null;
          return threadHtml(root, replies(root.id), text ? excerpt(text) : null);
        }).join("")
      : `<p class="tray-empty">No comments yet.</p>`;

    // Per-block comment badges in the document gutter.
    const perBlock = new Map();
    for (const root of sorted) {
      if (!root.display_block_id) continue;
      const info = perBlock.get(root.display_block_id) ?? { count: 0, open: 0, firstCid: root.id };
      info.count++;
      if (!root.resolved) info.open++;
      perBlock.set(root.display_block_id, info);
    }
    for (const [blockId, info] of perBlock) {
      const el = doc.querySelector(`[data-block-id="${CSS.escape(blockId)}"]`);
      if (!el || el.tagName === "HR") continue;
      const badge = document.createElement("button");
      badge.className = "cbadge" + (info.open ? "" : " resolved");
      badge.textContent = String(info.count);
      badge.title = info.open
        ? `${info.open} open comment${info.open > 1 ? "s" : ""} — view in tray`
        : "All comments on this block are resolved — view in tray";
      badge.dataset.gotoThread = info.firstCid;
      el.appendChild(badge);
    }

    // Counts on the tray toggle.
    const openCount = roots.filter((r) => !r.resolved).length;
    $("tray-toggle-n").textContent = roots.length ? String(roots.length) : "";
    $("tray-toggle").title = openCount
      ? `Comments — ${openCount} unresolved`
      : "Comments";
    $("tray-count").textContent = roots.length ? `· ${roots.length}` : "";

    $("diffdoc").hidden = true;
    doc.hidden = false;
    show("view-plan");
    updateTocActive();
  }

  async function reload() {
    const v = viewedVersion();
    state = await api(`/api/plans/${PLAN_ID}${v ? `?version=${v}` : ""}`);
    renderPlanView();
  }

  // --- auto-refresh: poll for new comments / versions ---
  function composing() {
    const active = document.activeElement;
    if (active && active.tagName === "TEXTAREA") return true;
    return [...document.querySelectorAll("textarea")].some((t) => t.value.trim());
  }
  let polling = false;
  async function poll() {
    if (polling || !state || document.hidden) return;
    if ($("view-plan").hidden) return;
    if (!$("compare-controls").hidden) return; // don't interrupt diff mode
    if (composing()) return; // don't clobber in-progress writing
    polling = true;
    try {
      const v = viewedVersion();
      const fresh = await api(`/api/plans/${PLAN_ID}${v ? `?version=${v}` : ""}`);
      if (JSON.stringify(fresh) !== JSON.stringify(state)) {
        const prevVersion = state.plan.current_version;
        const prevComments = state.comments.length;
        state = fresh;
        renderPlanView();
        if (fresh.plan.current_version > prevVersion) {
          toast(`Plan updated to v${fresh.plan.current_version}`);
        } else if (fresh.comments.length > prevComments) {
          toast("New comments");
        }
      }
    } catch {} finally {
      polling = false;
    }
  }
  setInterval(poll, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

  // --- interactions (event delegation on the whole plan view) ---
  $("view-plan").addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;

    try {
      if (btn.dataset.addComment) {
        const blockId = btn.dataset.addComment;
        const el = document.querySelector(`#doc [data-block-id="${CSS.escape(blockId)}"]`);
        const container = threadsContainerFor(el);
        if (!container.querySelector("[data-block-composer]")) {
          container.insertAdjacentHTML("beforeend", composerHtml(blockId));
          container.querySelector("[data-block-composer] textarea").focus();
        }
        return;
      }
      if (btn.dataset.gotoThread) {
        setTray(true);
        const thread = $("tray-threads").querySelector(`[data-cid="${CSS.escape(btn.dataset.gotoThread)}"]`);
        if (thread) { thread.scrollIntoView({ behavior: "smooth", block: "center" }); flash(thread); }
        return;
      }
      const act = btn.dataset.act;
      if (!act) return;

      if (act === "goto-block") {
        const el = document.querySelector(`#doc [data-block-id="${CSS.escape(btn.dataset.block)}"]`);
        if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); flash(el); }
        return;
      }
      if (act === "block-cancel") { btn.closest(".composer").remove(); return; }
      if (act === "block-send") {
        const composer = btn.closest(".composer");
        const body = composer.querySelector("textarea").value.trim();
        if (!body) return;
        await api(`/api/plans/${PLAN_ID}/comments`, {
          method: "POST",
          body: { body, block_id: btn.dataset.block, version: state.plan.version },
        });
        await reload();
        toast("Comment added");
        return;
      }
      if (act === "reply") {
        const composer = btn.closest(".thread").querySelector("[data-reply-composer]");
        composer.hidden = !composer.hidden;
        if (!composer.hidden) composer.querySelector("textarea").focus();
        return;
      }
      if (act === "reply-cancel") { btn.closest("[data-reply-composer]").hidden = true; return; }
      if (act === "reply-send") {
        const composer = btn.closest("[data-reply-composer]");
        const body = composer.querySelector("textarea").value.trim();
        if (!body) return;
        await api(`/api/plans/${PLAN_ID}/comments`, {
          method: "POST",
          body: { body, parent_id: btn.dataset.cid },
        });
        await reload();
        toast("Reply added");
        return;
      }
      if (act === "resolve") {
        await api(`/api/plans/${PLAN_ID}/comments/${btn.dataset.cid}/resolve`, {
          method: "POST",
          body: { resolved: btn.dataset.resolved !== "1" },
        });
        await reload();
        return;
      }
      if (act === "delete") {
        if (!confirm("Delete this comment thread?")) return;
        await api(`/api/plans/${PLAN_ID}/comments/${btn.dataset.cid}`, { method: "DELETE" });
        await reload();
        toast("Deleted");
        return;
      }
    } catch (err) {
      toast(err.message, true);
    }
  });

  $("general-send").addEventListener("click", async () => {
    const body = $("general-input").value.trim();
    if (!body) return;
    try {
      await api(`/api/plans/${PLAN_ID}/comments`, {
        method: "POST",
        body: { body, version: state.plan.version },
      });
      $("general-input").value = "";
      await reload();
      toast("Comment added");
    } catch (err) { toast(err.message, true); }
  });

  async function review(verdict) {
    const note = prompt(verdict === "approved" ? "Optional note (Enter to skip):" : "What should change? (optional)");
    if (note === null) return;
    try {
      await api(`/api/plans/${PLAN_ID}/review`, {
        method: "POST",
        body: { verdict, note: note.trim() || undefined, version: state.plan.current_version },
      });
      await reload();
      toast(verdict === "approved" ? "Approved" : "Changes requested");
    } catch (err) { toast(err.message, true); }
  }
  $("approve-btn").addEventListener("click", () => review("approved"));
  $("changes-btn").addEventListener("click", () => review("changes_requested"));

  $("version-select").addEventListener("change", (e) => {
    const v = Number(e.target.value);
    location.search = v === state.plan.current_version ? "" : `?v=${v}`;
  });

  // --- diff mode ---
  function fillDiffSelects() {
    const options = state.versions.map((v) => `<option value="${v.version}">v${v.version}</option>`).join("");
    $("diff-from").innerHTML = options;
    $("diff-to").innerHTML = options;
    $("diff-from").value = String(Math.max(1, state.plan.current_version - 1));
    $("diff-to").value = String(state.plan.current_version);
  }
  async function showDiff() {
    const from = $("diff-from").value;
    const to = $("diff-to").value;
    try {
      const { parts } = await api(`/api/plans/${PLAN_ID}/diff?from=${from}&to=${to}`);
      $("diffdoc").innerHTML = parts.map((part) => `<div class="dpart ${part.type}">${part.html}</div>`).join("");
      $("doc").hidden = true;
      $("diffdoc").hidden = false;
      document.body.classList.add("diffing");
    } catch (err) { toast(err.message, true); }
  }
  $("compare-btn").addEventListener("click", () => {
    if (state.versions.length < 2) { toast("Only one version so far"); return; }
    fillDiffSelects();
    $("compare-btn").hidden = true;
    $("compare-controls").hidden = false;
    showDiff();
  });
  $("compare-close").addEventListener("click", () => {
    $("compare-controls").hidden = true;
    $("compare-btn").hidden = false;
    $("diffdoc").hidden = true;
    $("doc").hidden = false;
    document.body.classList.remove("diffing");
  });
  $("diff-from").addEventListener("change", showDiff);
  $("diff-to").addEventListener("change", showDiff);

  // --- boot ---
  $("signin-btn").addEventListener("click", signIn);

  async function boot() {
    if (!/^[a-f0-9]{10}$/.test(PLAN_ID || "")) { show("view-missing"); return; }
    try {
      await handleCallback();
    } catch (err) {
      toast("Sign-in failed: " + err.message, true);
    }
    try {
      me = (await api("/api/me")).user;
      $("user-name").textContent = me.name || me.email || me.id.slice(0, 12);
      if (me.picture) { $("user-pic").src = me.picture; $("user-pic").hidden = false; }
      await reload();
      // Tray: remembered preference, else open when there is anything to read.
      const trayPref = localStorage.getItem("plans-tray");
      setTray(trayPref ? trayPref === "open" : state.comments.length > 0, false);
    } catch (err) {
      if (err.unauthorized) { show("view-signin"); return; }
      if (err.missing) { show("view-missing"); return; }
      toast(err.message, true);
      show("view-missing");
    }
  }
  boot();
})();
</script>
</body>
</html>
