<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello Myslop</title><style>body{font:16px system-ui;max-width:700px;margin:70px auto;padding:20px;background:#f5f4ef;color:#222}main{background:white;padding:30px;border-radius:14px}button{padding:8px 13px}</style></head><body><main><h1>Hello from Myslop Apps</h1><p id="identity">Loading identity…</p><button id="count">Count</button> <span id="value">0</span></main><script>async function load(){const me=await fetch('/api/me').then(r=>r.json());document.querySelector('#identity').textContent=`Signed in as ${me.name||me.email}`;const count=await fetch('/api/count').then(r=>r.json());document.querySelector('#value').textContent=count.value}document.querySelector('#count').onclick=async()=>{const count=await fetch('/api/count',{method:'POST'}).then(r=>r.json());document.querySelector('#value').textContent=count.value};load()</script></body></html>
