<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Myslop Apps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2325251f'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='serif' font-size='20' font-weight='700' fill='white'%3Em%3C/text%3E%3C/svg%3E">
<script>
(() => {
  // Applies the stored theme before first paint; must stay in sync with theme-provider.tsx.
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try {
    const stored = localStorage.getItem("myslop-dashboard-theme");
    if (stored === "light" || stored === "dark") dark = stored === "dark";
  } catch {}
  document.documentElement.classList.toggle("dark", dark);
  document.documentElement.style.colorScheme = dark ? "dark" : "light";
})();
</script>
<link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
<div id="myslop-dashboard-react-root"></div>
<noscript>Myslop Apps requires JavaScript to sign in and manage applications.</noscript>
<script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
